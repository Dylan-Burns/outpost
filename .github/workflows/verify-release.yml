# Rebuilds a release from its tag and compares it, byte for byte, with what
# projectoutpost.org serves. Runs when a release is tagged, every Monday, and
# by hand. Anyone can run the same check: scripts/verify-release.sh X.Y.Z
name: verify-release
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Release to check (empty for the newest)
        required: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: node/go.mod }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - env:
          WANT: ${{ inputs.version }}
        run: |
          v="${WANT:-$(sed -n 's/.*"version":"\([0-9.]*\)".*/\1/p' site/public/releases/latest.json)}"
          # The tag is pushed before the site is deployed, so on a tag push
          # wait up to 20 minutes for the release to appear.
          for i in $(seq 40); do
            curl -fsSI "https://projectoutpost.org/releases/v$v/SHA256SUMS" >/dev/null 2>&1 && break
            echo "waiting for v$v on projectoutpost.org ($i/40)"; sleep 30
          done
          scripts/verify-release.sh "$v"
